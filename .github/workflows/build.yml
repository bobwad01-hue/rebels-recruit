name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit user-facing College terminology
        run: |
          echo '--- College terminology audit (source only) ---'
          grep -RInE "College|Colleges|college|colleges" app components --include='*.tsx' --include='*.ts' | grep -vE "from\('colleges'\)|from\(\"colleges\"\)|athlete_colleges|college_coaches|college_id|college_enrichment|college_majors|college_fit_profiles|/colleges|CollegeSearchSelect|CollegesCoachesBoard|collegeName|masterColleges|fallbackColleges|trackedCollege|activeColleges|visibleColleges|collegeSort|CollegeSort|restoreCollege|addCollege|requestArchiveCollege|kind:'college'|kind === 'college'|kind==='college'|\.colleges|type College|function College|NewCollege|allColleges|collegeId|const college|let college" || true
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          GOOGLE_WORKSPACE_CLIENT_ID: test-client-id
          GOOGLE_WORKSPACE_CLIENT_SECRET: test-client-secret
          GOOGLE_TOKEN_ENCRYPTION_KEY: test-encryption-key
