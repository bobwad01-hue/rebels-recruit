name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply spreadsheet security migration
        if: github.event_name == 'push'
        run: |
          node scripts/apply-spreadsheet-security.mjs
          if ! git diff --quiet -- app/import/page.tsx app/exports/page.tsx; then
            git config user.name "rebels-recruit-ci"
            git config user.email "actions@users.noreply.github.com"
            git add app/import/page.tsx app/exports/page.tsx
            git commit -m "Replace vulnerable spreadsheet library"
            git push origin HEAD:main
          fi
      - run: npm run audit:language
      - run: npm run test:scale
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          GOOGLE_WORKSPACE_CLIENT_ID: test-client-id
          GOOGLE_WORKSPACE_CLIENT_SECRET: test-client-secret
          GOOGLE_TOKEN_ENCRYPTION_KEY: test-encryption-key
