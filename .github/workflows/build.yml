name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Migrate organization activity reliability
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/migrate-organization-activity-feed.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/organization/OrganizationCommandCenter.tsx
            git commit -m "Harden organization activity loading"
            git push
          fi
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run audit:language
      - run: npm run test:fixtures
      - run: npm run test:spreadsheets
      - run: npm run test:scale
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          GOOGLE_WORKSPACE_CLIENT_ID: test-client-id
          GOOGLE_WORKSPACE_CLIENT_SECRET: test-client-secret
          GOOGLE_TOKEN_ENCRYPTION_KEY: test-encryption-key